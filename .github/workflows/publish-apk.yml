name: Publish verified test APK
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: Temporary URL for the approved APK
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download and verify approved APK
        env:
          APK_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          echo "::add-mask::$APK_SOURCE_URL"
          curl --fail --location --retry 3 --max-time 240 -o TramConnect-test.apk "$APK_SOURCE_URL"
          echo "8e96f84b2351ad352a772eb1f030de256422780b7a7a9bb8d43b3d38ae1afb2a  TramConnect-test.apk" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish public test download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create android-test-1 TramConnect-test.apk SHA256SUMS.txt --prerelease --title "TramConnect Android test APK" --notes "Experimental Android test build. No Expo Go required. Use an empty test wallet only: this app connects to the live wallet backend and transactions are real. Development-key signed; not a Google Play release or security-reviewed wallet. Download TramConnect-test.apk below and open it on Android to install."
